[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pms-can-demo"
version = "0.1.0"
description = "PMS CAN communication demo GUI (PySide6); UI shell first"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6==6.8.1.1",
    "can-zlg",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pms_can_demo"]

[tool.hatch.build.targets.wheel.force-include]
"src/pms_can_demo/qml" = "pms_can_demo/qml"
"src/pms_can_demo/protocol/meas_frames.json" = "pms_can_demo/protocol/meas_frames.json"
"src/pms_can_demo/protocol/config_frames.json" = "pms_can_demo/protocol/config_frames.json"

[tool.uv]
package = true

[tool.uv.sources]
can-zlg = { path = "./can-zlg", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src", "can-zlg"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
exclude = [".venv", "__pycache__", "build", "dist", "can-zlg"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.13"
python = ".venv"
extra-paths = ["src", "can-zlg"]

[tool.ty.src]
include = ["src", "tests"]
