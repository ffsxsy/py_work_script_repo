# 开发工具元配置：uv 虚拟环境与各子项目依赖组。
# ruff / ty / pytest：全局 uv tool（见 AGENTS.md）。
# openpyxl / pytest：在 dev 依赖组；ruff / ty 仍用 uv tool（见 AGENTS.md）。
# 各顶层工具目录仍为独立项目，将来可整目录拆仓。

[project]
name = "py-work-script-repo-dev"
version = "0.0.0"
description = "Dev tooling and shared uv groups for py_work_script_repo monorepo"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
# fault_recording_parse_excel_template：构建 xlsm 需 win32com
fault-recording = [
    "pywin32>=306",
]
# 根目录 pytest / 多子项目 Excel 脚本（openpyxl 无 CLI，须进 .venv）
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
]

[tool.uv]
default-groups = ["fault-recording", "dev"]

[tool.ruff]
target-version = "py315"
line-length = 100
src = [
    "1.fault_recording_parse_excel_template",
    "2.McuCanMap_script",
    "3.wireshark_plugin",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# ty：IDE 扩展（astral-sh.ty）+ CLI（ty check）+ CI 共用
[tool.ty.environment]
python-version = "3.15"
python = ".venv"
root = ["."]

[tool.ty.src]
include = [
    "1.fault_recording_parse_excel_template",
    "2.McuCanMap_script",
    "3.wireshark_plugin",
    "tests",
]
