[project]
name = "modbus-slave-sim"
version = "0.1.0"
description = "Generic Modbus slave simulator GUI (multi-device, project file, four register areas)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "PySide6==6.8.1.1",
    "pymodbus[serial]>=3.11.0,<3.12",
]

[project.optional-dependencies]
# ruff / ty / pytest 使用系统 uv tool；此处仅项目专属测试插件
dev = [
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
modbus-slave-sim = "modbus_slave_sim.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modbus_slave_sim"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
exclude = [".venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["modbus_slave_sim"]
omit = ["*/tests/*", "*/main.py", "*/main_window.py", "*/widgets/*"]
